# Settings for hosting Dressify for free on Render (https://render.com).
services:
  - type: web
    name: dressify
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/options
    envVars:
      # Free key from https://pixabay.com/api/docs/ for outfit photos.
      # Render asks you to type it in; it is never stored in the code.
      - key: PIXABAY_API_KEY
        sync: false
